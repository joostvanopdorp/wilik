name: wilik

services:
  backend:
    build: ./backend
    image: ghcr.io/joostvanopdorp/wilik-backend:latest
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    volumes:
      - wilik-data:/app/instance
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "docker-volume-backup.stop-during-backup=true"

  frontend:
    build: ./frontend
    image: ghcr.io/joostvanopdorp/wilik-frontend:latest
    ports:
      # WILIK_PORT in .env changes the published port. Set it to e.g. 127.0.0.1:8090
      # to keep Wilik off the LAN when a reverse proxy reaches it over a Docker network.
      - "${WILIK_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # containrrr/watchtower is unmaintained (archived Dec 2025) and fails against
    # newer Docker Engine API versions ("client version 1.25 is too old"). This is
    # a drop-in, actively maintained fork with the same config/behavior.
    image: nickfedor/watchtower
    # On by default. Set WATCHTOWER_REPLICAS=0 in .env if something else (e.g. Renovate,
    # Komodo) already keeps the images up to date on this host. Needs Docker Compose
    # 2.24 or newer; older versions silently ignore scale: 0. (Not deploy.replicas:
    # tools that read this file without interpolation, like Komodo, expect a number
    # there and then can't see any service.)
    scale: ${WATCHTOWER_REPLICAS:-1}
    # Watchtower keeps itself up to date as well.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      # WATCHTOWER_NOTIFICATION_URL: "" # optional: shoutrrr URL (Slack/email/etc) to get notified on auto-update
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    image: offen/docker-volume-backup:v2
    # Watchtower pulls new v2 releases; a new major (v3) needs a change here.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "wilik-backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "wilik-backup-"
      BACKUP_RETENTION_DAYS: "30"
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET:-}
      AWS_S3_PATH: "wilik"
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:-s3.amazonaws.com}
      NOTIFICATION_URLS: ${BACKUP_NOTIFICATION_URL:-}
    volumes:
      - wilik-data:/backup/wilik-data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  wilik-data:
