server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. With the backend address in a variable, nginx looks it up
    # again at request time instead of once at startup, so a recreated backend
    # container (new IP) keeps working without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # no URI part here: with a variable, nginx passes the request path through
        # unchanged, which is already /api/...
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # client-side routing: let react-router handle unknown paths
    location / {
        try_files $uri /index.html;
    }
}
